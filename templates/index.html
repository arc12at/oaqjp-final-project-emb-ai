
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 60px auto;
            padding: 24px;
            background: #f4f7fb;
            color: #243047;
        }
        main {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 6px 24px #20305015;
        }
        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 120px;
            padding: 12px;
            margin: 12px 0;
        }
        button {
            background: #3563e9;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
        }
        #result { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
<main>
    <h1>Emotion Detector</h1>
    <p>Enter a sentence to analyze its emotions.</p>
    <form action="/emotionDetector" method="get">
        <textarea name="textToAnalyze"
                  placeholder="Type your sentence here..."
                  required></textarea>
        <button type="submit">Analyze Emotion</button>
    </form>
    <div id="result" aria-live="polite"></div>
</main>
</body>
</html>
